name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (syntax errors / undefined names only)
        run: flake8 src --select=E9,F63,F7,F82 --show-source

      - name: Smoke test (app imports and starts)
        run: python -c "from src.main import app; print('OK:', app.title)"
